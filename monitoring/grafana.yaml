replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: false

service:
  type: ClusterIP

adminUser: admin
adminPassword: admin

plugins:
  - victoriametrics-logs-datasource 0.31.0

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true
        editable: true

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.opentelemetry.svc.cluster.local:16686
        editable: true

      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server.logging.svc.cluster.local:9428
        editable: true
        jsonData:
          otelPreset:
            enabled: true
            tracesDatasourceUid: jaeger
            detection:
              traceIdField: trace_id
              severity:
                field: severity_text
                valueCase: string
                source: manual
